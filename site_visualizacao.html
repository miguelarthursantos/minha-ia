<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ site["nome"] }}</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            overflow: hidden;
        }

        .barra {
            height: 56px;
            width: 100%;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 0 18px;
            background: #111827;
            color: white;
        }

        .voltar {
            border: 0;
            border-radius: 8px;
            padding: 9px 14px;
            background: #374151;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }

        .voltar:hover {
            background: #4b5563;
        }

        .titulo {
            font-size: 16px;
            font-weight: 600;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .preview {
            display: block;
            width: 100%;
            height: calc(100% - 56px);
            border: 0;
            background: white;
        }
    </style>
</head>

<body>

    <div class="barra">
        <button class="voltar" onclick="history.back()">
            ← Voltar
        </button>

        <div class="titulo">
            {{ site["nome"] }}
        </div>
    </div>

    <iframe
        id="previewSite"
        class="preview"
        title="Pré-visualização do site">
    </iframe>

    <script>
        const htmlGerado = {{ site["html"] | tojson }};

        const iframe = document.getElementById("previewSite");

        iframe.srcdoc = htmlGerado;
    </script>

</body>
</html>
